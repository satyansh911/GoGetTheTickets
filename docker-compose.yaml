# Local Redis for `./mvnw spring-boot:run`, plus Redis Commander at http://localhost:8081 for inspecting keys.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
