# Local Postgres and Redis for `./mvnw spring-boot:run`.
# Redis Commander at http://localhost:8081 shows live seat holds.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gogetthetickets
      POSTGRES_USER: ggt
      POSTGRES_PASSWORD: ggt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"

volumes:
  pgdata:
