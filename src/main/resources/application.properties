spring.application.name=GoGetTheTickets

# Hosting platforms (e.g. Render) pass the port and Redis location as environment variables.
server.port=${PORT:8080}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# JSON fields are snake_case (session_id, seats_per_row, ...) to match the frontend.
spring.jackson.property-naming-strategy=SNAKE_CASE

# How long a seat stays held before it is released automatically.
booking.hold-ttl=2m

# /actuator/health reports UP only when Redis is reachable; used as the deploy health check.
management.endpoints.web.exposure.include=health
