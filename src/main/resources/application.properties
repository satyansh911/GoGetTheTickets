spring.application.name=GoGetTheTickets

# Hosting platforms (e.g. Render) pass the port and service locations as environment variables.
server.port=${PORT:8080}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gogetthetickets}
spring.datasource.username=${DATABASE_USERNAME:ggt}
spring.datasource.password=${DATABASE_PASSWORD:ggt}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
# A small container doesn't need Tomcat's default 200 threads.
server.tomcat.threads.max=${TOMCAT_THREADS:40}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Signing key for login tokens. The default is for local development only; production sets JWT_SECRET.
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes}
app.jwt.lifetime=7d

# How long seats stay held during checkout.
booking.hold-ttl=10m
# Simulated walk-in sales so demo seat maps look busy (see DemoOccupancy).
booking.demo-occupancy=true

# /actuator/health reports UP only when Postgres and Redis are reachable; used as the deploy health check.
management.endpoints.web.exposure.include=health

# Vite fingerprints asset file names, so they can be cached for a year.
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
